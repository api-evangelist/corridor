aid: corridor
name: Corridor
description: >-
  Corridor is a security company building the security layer for AI coding.
  Founded by Jack Cable (former CISA) and backed by Felicis, Corridor secures
  AI-generated code at the source: it plugs into AI coding assistants and IDEs
  (Claude Code, Cursor, VS Code, Codex, Devin, Factory) to deliver real-time
  security guardrails as code is generated, automated security PR reviews on
  GitHub and GitLab, pre-commit scanning, findings management, and MCP
  compliance enforcement. Corridor exposes a REST API and an official hosted
  Model Context Protocol (MCP) server so agents and CI/CD pipelines can query
  findings, manage guardrails, look up PR reviews, and read dashboard data.
